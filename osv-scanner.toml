# OSV-Scanner ignores dev-only transitive dependencies.
# finita ships zero runtime deps — everything in the lockfile is dev-only.

[[PackageOverrides]]
name = "basic-ftp"
ecosystem = "npm"
ignore = true
reason = "Dev-only transitive dep (release-it > proxy-agent > pac-proxy-agent > get-uri)"

[[PackageOverrides]]
name = "undici"
ecosystem = "npm"
ignore = true
reason = "Dev-only transitive dep (release-it > undici); not shipped in the published package"

[[PackageOverrides]]
name = "esbuild"
ecosystem = "npm"
ignore = true
reason = "Dev-only build/test tooling dep (tsup, vitest > vite); not shipped in the published package"

[[PackageOverrides]]
name = "js-yaml"
ecosystem = "npm"
ignore = true
reason = "Dev-only transitive dep (@commitlint/cli > @commitlint/load > cosmiconfig); not shipped in the published package"

[[PackageOverrides]]
name = "vitest"
ecosystem = "npm"
ignore = true
reason = "Dev-only test runner; not shipped in the published package. GHSA-82fw-gwwq-j7x9 is fixed only in vitest 4.1.11, a major upgrade tracked in #77"

[[PackageOverrides]]
name = "@vitest/mocker"
ecosystem = "npm"
ignore = true
reason = "Dev-only transitive dep (vitest > @vitest/mocker); not shipped in the published package. Same advisory and fix as vitest"
